<!doctype html>
<html lang="bn">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <meta name="pureorigins-api" content=""/>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self' http://localhost:5000 http://127.0.0.1:5000 https://pureorigins.onrender.com https://*.onrender.com; img-src 'self' data: https: http:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; script-src 'self';"/>
  <title>PureOrigins Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="/admin/admin.css"/>
</head>
<body>
  <main class="admin-shell">
    <section id="loginView" class="login-view">
      <div class="login-card">
        <p class="eyebrow">PureOrigins Admin</p>
        <h1>নিরাপদ ড্যাশবোর্ড</h1>
        <p class="muted">শুধু অ্যাডমিন ইউজার লগইন করলে পণ্য, অর্ডার, কুপন ও রিপোর্ট ম্যানেজ করতে পারবে।</p>
        <form id="adminLogin" class="form-stack">
          <label>ইমেইল/ফোন
            <input name="phoneOrEmail" placeholder="Admin email or phone" autocomplete="username" required/>
          </label>
          <label>পাসওয়ার্ড
            <span class="password-wrap">
              <input id="loginPassword" name="password" type="password" placeholder="Password" autocomplete="current-password" required/>
              <button type="button" id="togglePassword" class="icon-btn" aria-label="Show password">👁</button>
            </span>
          </label>
          <p class="muted small">Session is stored in this browser tab only.</p>
          <button class="primary-btn" type="submit">Login</button>
        </form>
        <p id="loginMessage" class="login-message"></p>
      </div>
    </section>

    <div id="navOverlay" class="nav-overlay hidden" aria-hidden="true"></div>

    <section id="adminView" class="dashboard hidden">
      <aside class="sidebar" aria-label="Admin navigation">
        <div class="brand">
          <span aria-hidden="true">🌿</span>
          <strong>PureOrigins</strong>
          <small>Admin</small>
        </div>
        <button type="button" id="sidebarCollapse" class="ghost-btn sidebar-toggle" title="Collapse sidebar">⟨</button>
        <nav id="adminNav" class="nav-tabs"></nav>
        <label class="compact-toggle">
          <input type="checkbox" id="compactTables"/>
          Compact tables
        </label>
        <button type="button" id="logoutBtn" class="ghost-btn logout-btn">Logout</button>
      </aside>

      <div class="main-column">
        <header class="topbar">
          <div class="topbar-left">
            <button type="button" id="menuBtn" class="icon-btn menu-btn" aria-label="Open menu">☰</button>
            <div>
              <p class="eyebrow">Production admin</p>
              <h1 id="screenTitle">Dashboard</h1>
            </div>
          </div>
          <div class="admin-user">
            <span id="adminName">Admin</span>
            <small id="adminRole">role: admin</small>
          </div>
        </header>

        <div class="screens">
          <section id="screen-dashboard" class="screen active" aria-label="Dashboard"></section>
          <section id="screen-products" class="screen" aria-label="Products"></section>
          <section id="screen-orders" class="screen" aria-label="Orders"></section>
          <section id="screen-coupons" class="screen" aria-label="Coupons"></section>
          <section id="screen-reviews" class="screen" aria-label="Reviews"></section>
          <section id="screen-banners" class="screen" aria-label="Banners"></section>
          <section id="screen-reports" class="screen" aria-label="Reports"></section>
          <section id="screen-customers" class="screen" aria-label="Customers"></section>
          <section id="screen-messages" class="screen" aria-label="Messages"></section>
        </div>
      </div>
    </section>
  </main>
  <script type="module" src="/admin/main.js"></script>
</body>
</html>
