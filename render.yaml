services:
  - type: web
    name: pureorigins-backend
    env: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    plan: free
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: COOKIE_SECURE
        value: true
      - key: COOKIE_SAMESITE
        value: none
      - key: FRONTEND_ORIGIN
        value: https://pureorigins.vercel.app
      - key: BACKEND_PUBLIC_URL
        value: https://pureorigins.onrender.com
      - key: GOOGLE_SHEET_WEBHOOK_URL
        sync: false
      - key: GOOGLE_SHEET_WEBHOOK_SECRET
        sync: false
